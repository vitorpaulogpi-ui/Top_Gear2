<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Gear 2 - SNES</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0b0b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            overflow: hidden;
        }
        h1 {
            margin: 15px 0;
            font-size: 1.4rem;
            color: #e50914;
            text-shadow: 0 0 10px rgba(229, 9, 20, 0.5);
        }
        #game-area {
            width: 800px;
            height: 600px;
            max-width: 95vw;
            max-height: 80vh;
            background-color: #000;
            border: 4px solid #222;
            border-radius: 4px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <h1>Top Gear 2 - Super Nintendo</h1>
    <div id="game-area"></div>

    <script>
        // Descobre automaticamente a URL da sua ROM hospedada no seu GitHub Pages
        const currentFolder = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
        const romName = 'Top_Gear_2.sfc'; // DIGITE O NOME EXATO DO SEU ARQUIVO AQUI
        
        EJS_player = '#game-area';
        EJS_core = 'snes';
        EJS_gameUrl = currentFolder + romName;
        EJS_pathtodata = 'https://jsdelivr.net';
        EJS_startOnLoaded = true;
    </script>
    
    <!-- Carrega o script principal de uma CDN estável (jsDelivr) que não bloqueia o GitHub -->
    <script src="https://jsdelivr.netloader.js"></script>

</body>
</html>
